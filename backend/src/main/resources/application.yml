spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: parkflow
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parkflow}
    username: ${DB_USER:parkflow}
    password: ${DB_PASSWORD:parkflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    deserialization:
      accept-single-value-as-array: true

server:
  port: ${PORT:8080}

parkflow:
  # Khóa của nhà cung cấp gửi sự kiện (header X-Api-Key), nhiều khóa ngăn bằng dấu phẩy. Để trống khi chạy dev thì không chặn.
  api-keys: ${EVENTS_API_KEY:}
  history:
    # Nạp lịch sử đóng gói khi khởi động (nền, chỉ khi CSDL chưa có). Tắt mặc định để kiểm thử nhanh; bản chạy thật bật.
    auto-import: ${HISTORY_AUTO_IMPORT:false}
  ai:
    # Bật thì trợ lý trả lời bằng dữ liệu mẫu dựng từ số liệu thật, không gọi mô hình (demo không gián đoạn).
    mock: ${AI_MOCK:false}
    groq:
      key: ${GROQ_API_KEY:}
    gemini:
      key: ${GEMINI_API_KEY:}
